.stat-sub{font-size:12px;font-weight:400;fill:var(--on-surface-variant);}
.note{font-size:12px;font-weight:400;fill:var(--on-surface-variant);}
.peak-tag{font-size:12px;font-weight:600;fill:var(--on-surface);}
