  --surface-container:#F3EDF7;
  --font:-apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --card:#211F26;
    --on-surface:#E6E0E9;
    --on-surface-variant:#CAC4D0;
    --outline-variant:#49454F;
