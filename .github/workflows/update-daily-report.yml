name: Update daily report

on:
  schedule:
    # 每 2 小时（UTC）：每次定稿「昨天」+ 滚动刷新「今天」
    - cron: "0 */2 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "要生成的自然日（YYYY-MM-DD，留空=昨天，Asia/Shanghai）"
        required: false
        type: string

permissions:
  contents: write
  issues: read
  pull-requests: read

# Shared with update-activity.yml so the two workflows never race on push.
concurrency:
  group: update-activity
  cancel-in-progress: false

jobs:
  daily-report:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 设置 Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: 生成/刷新日报（昨天定稿 + 今天滚动）
        run: node scripts/daily/index.mjs ${{ inputs.date && format('--date={0}', inputs.date) || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          SENSENOVA_API_KEY: ${{ secrets.SENSENOVA_API_KEY }}

      - name: 提交并推送更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet && exit 0
          git commit -m "chore: 更新每日活动日报"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase --autostash origin main
          done
          echo "推送失败：重试 3 次后仍未成功" >&2
          exit 1
