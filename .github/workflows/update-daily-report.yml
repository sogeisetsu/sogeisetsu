name: Update daily report

on:
  # 兜底：本仓的生成脚本 / 本 workflow 推送到 main 后立刻重跑，不必等下一次 cron。
  # paths 白名单天然防自触发——自动提交只碰 docs/，不在白名单里。
  push:
    branches: [main]
    paths:
      - "scripts/daily/**"
      - ".github/workflows/update-daily-report.yml"
  schedule:
    # 每 2 小时（UTC）：每次定稿「昨天」+ 滚动刷新「今天」。
    # 故意避开整点：:00 是 GitHub schedule 投递最拥堵的时刻（官方文档明说会被延迟、
    # 拥堵严重时直接丢弃），实测本仓曾被延迟 +1 ~ +47 分钟，2026-10-08 更连丢 3 趟。
    # 与 update-activity.yml 的 :30 也错开。
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "要生成的自然日（YYYY-MM-DD，留空=昨天，Asia/Shanghai）"
        required: false
        type: string
      force:
        description: "强制重取数据并重调 AI（忽略内容哈希；用于验证 AI 生成）"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: read
  pull-requests: read

# Shared with update-activity.yml so the two workflows never race on push.
concurrency:
  group: update-activity
  cancel-in-progress: false

jobs:
  daily-report:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 设置 Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: 生成/刷新日报（昨天定稿 + 今天滚动）
        run: node scripts/daily/index.mjs ${{ inputs.date && format('--date={0}', inputs.date) || '' }} ${{ inputs.force && '--force' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          SENSENOVA_API_KEY: ${{ secrets.SENSENOVA_API_KEY }}

      - name: 提交并推送更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet && exit 0
          git commit -m "chore: 更新每日活动日报"
          # 生成物 docs/ 可丢弃：并发运行 rebase 撞车时，-X theirs 保留本次新生成的版本，避免冲突失败
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase --autostash -X theirs origin main
          done
          echo "推送失败：重试 3 次后仍未成功" >&2
          exit 1
