name: Update daily report

on:
  # 兜底：本仓的生成脚本 / 本 workflow 推送到 main 后立刻重跑，不必等下一次 cron。
  # paths 白名单天然防自触发——自动提交只碰 docs/，不在白名单里。
  push:
    branches: [main]
    paths:
      - "scripts/daily/**"
      - "scripts/notify-ai-failure.mjs"
      # provider 链 / 模型 / 参数 / lane 预算的单一事实来源：改它就等于改 AI 生成行为，
      # 合并后立刻跑一次真实日报（这条也是 A1 的验收证据）。
      - "config/**"
      - ".github/workflows/update-daily-report.yml"
  schedule:
    # 每 2 小时（UTC）：每次定稿「昨天」+ 滚动刷新「今天」。
    # 故意避开整点：:00 是 GitHub schedule 投递最拥堵的时刻（官方文档明说会被延迟、
    # 拥堵严重时直接丢弃），实测本仓曾被延迟 +1 ~ +47 分钟，2026-10-08 更连丢 3 趟。
    # 与 update-activity.yml 的 :30 也错开。
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "要生成的自然日（YYYY-MM-DD，留空=昨天，Asia/Shanghai）"
        required: false
        type: string
      force:
        description: "强制重取数据并重调 AI（忽略内容哈希；用于验证 AI 生成）"
        required: false
        type: boolean
        default: false
      diagnose:
        description: "强制再跑一次失败诊断（跳过「只有首次失败才诊断」的去重）"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pull-requests: read

# Shared with update-activity.yml so the two workflows never race on push.
concurrency:
  group: update-activity
  cancel-in-progress: false

jobs:
  daily-report:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 设置 Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: 生成/刷新日报（昨天定稿 + 今天滚动）
        run: node scripts/daily/index.mjs ${{ inputs.date && format('--date={0}', inputs.date) || '' }} ${{ inputs.force && '--force' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          SENSENOVA_API_KEY: ${{ secrets.SENSENOVA_API_KEY }}
          # 日报链首两条腿（config/providers.json 的 lanes.daily）；provider check 会挡漏配
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          # 链尾兜底（小红书 Dots）
          DOTS_API_KEY: ${{ secrets.DOTS_API_KEY }}

      - name: AI 失败可见性（开/关 issue + 回写 + 重渲染）
        id: notify
        run: node scripts/notify-ai-failure.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 逃生口：仅在 workflow_dispatch 勾了 diagnose 时非空 → 追加评论的路径也强制再诊断一次
          DIAGNOSE: ${{ inputs.diagnose && '1' || '' }}

      - name: 提交并推送更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet && exit 0
          git commit -m "chore: 更新每日活动日报"
          # 生成物 docs/ 可丢弃：并发运行 rebase 撞车时，-X theirs 保留本次新生成的版本，避免冲突失败
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase --autostash -X theirs origin main
          done
          echo "推送失败：重试 3 次后仍未成功" >&2
          exit 1

      # ── AI 失败诊断（自动档）：只在「本次新建了常驻 ai-failure issue」（ok→failed 的首次转换）
      #    时跑，且整段在「提交并推送」之后 —— 诊断再怎么坏也绝不阻塞生成物发布。
      #    三层：纯脚本证据 → LLM 叙述（可缺席）→ workflow 自己回帖（写权限只在这一步）。
      - name: 安装 opencode CLI（仅诊断-叙述用，不进生成链路）
        if: steps.notify.outputs.should_diagnose == 'true'
        continue-on-error: true
        timeout-minutes: 5
        run: |
          # 与 anomalyco/opencode/github action 同源的官方安装脚本（装最新版到 ~/.opencode/bin）。
          # 只在真要诊断时装，cron 正常路径不付这个代价；不加 actions/cache（诊断本身低频）。
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: 诊断-证据（纯脚本，不依赖 LLM）
        id: diag
        if: steps.notify.outputs.should_diagnose == 'true'
        continue-on-error: true
        timeout-minutes: 5
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          SENSENOVA_API_KEY: ${{ secrets.SENSENOVA_API_KEY }}
          # 诊断会探每个 enabled endpoint 的 /models，缺 key 会误报「未配置」
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          DOTS_API_KEY: ${{ secrets.DOTS_API_KEY }}
        run: node scripts/diagnose-providers.mjs

      - name: 诊断-叙述（LLM，追加结论；LLM 起不来就只留证据）
        if: steps.diag.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 10
        env:
          OPENCODE_AUTH_CONTENT: ${{ secrets.OPENCODE_AUTH_CONTENT }}
          # 凭据不依赖 auth.json：直接用仓库已有的两个 key（下面 OPENCODE_CONFIG_CONTENT 用 {env:…} 注入），
          # 所以 OPENCODE_AUTH_CONTENT 没配也能叙述（实测：auth.json 为空 + 本配置 → 调用成功）
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          SENSENOVA_API_KEY: ${{ secrets.SENSENOVA_API_KEY }}
          # 默认走 Go 套餐内的 deepseek（免费腿 2026-10-23 已下线）；Go 整体不可用时把仓库变量 DIAG_MODEL 换成 sensenova/glm-5.2（下面已备好该 provider）
          DIAG_MODEL: ${{ vars.DIAG_MODEL || 'opencode-go/deepseek-v4.1-flash' }}
          # opencode-go 只覆盖 apiKey（npm / api / 模型目录仍取 models.dev），sensenova 作为 Go 挂掉时的 fallback 腿
          OPENCODE_CONFIG_CONTENT: |
            {"$schema":"https://opencode.ai/config.json","provider":{"opencode-go":{"options":{"apiKey":"{env:OPENCODE_API_KEY}"}},"sensenova":{"npm":"@ai-sdk/openai-compatible","name":"SenseNova","options":{"baseURL":"https://token.sensenova.cn/v1","apiKey":"{env:SENSENOVA_API_KEY}"},"models":{"glm-5.2":{"name":"GLM-5.2"}}}}}
        run: |
          # 发布已经推送完毕：先摘掉 checkout 留下的 git 凭据，让 agent 连「推 main」的能力都没有
          # （本步不注入任何 GitHub token；回帖由下一步用 GH_TOKEN 自己做）
          git config --local --unset-all http.https://github.com/.extraheader || true
          node scripts/diagnose-narrate.mjs

      - name: 诊断-回帖（正文来自文件；只有 workflow 会写 issue）
        if: steps.diag.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          N="${{ steps.notify.outputs.issue_number }}"
          if [ -z "$N" ]; then
            echo "::warning::AI 诊断：没拿到 issue 编号（step output 传递失败），跳过回帖 —— 绝不猜编号"
            exit 0
          fi
          # 去重：同一次失败事件（同一 run + 同一 generatedAt）的诊断只贴一遍（纯 REST，不经 LLM）
          MARKER=$(grep -m1 '^<!-- ai-diagnosis ' data/ai-diagnosis.md || true)
          if [ -n "$MARKER" ] && gh api "repos/${GITHUB_REPOSITORY}/issues/${N}/comments?per_page=100" --jq '.[].body' | grep -qF "$MARKER"; then
            echo "::notice::AI 诊断：同一失败事件的诊断已存在，跳过重复回帖"
            exit 0
          fi
          gh issue comment "$N" --repo "$GITHUB_REPOSITORY" --body-file data/ai-diagnosis.md
