name: Check

on:
  push:
  pull_request:
  # 手动补跑：生成物是 bot 用 GITHUB_TOKEN 推的，不会触发 push/PR —— 线上出问题
  # 或刚重生成完 docs/ 时，需要有办法对当前 HEAD 单独跑一遍。
  workflow_dispatch:

# 纯预检：只读、零 secret、不碰 docs/，所以只给读权限。
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7

      - name: 设置 Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: 预检（不变式自检）
        run: node scripts/daily/check.mjs
