name: tmp-minimax-probe

# 一次性探针（用完即删，不进 main）。第五轮：端到端 —— 用真实数据 + 真实
# defaultProviders() 链调 generateNarrative，看 minimax（reasoning_effort=low）能否一次过。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: real chain end-to-end
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          node --input-type=module - <<'EOF'
          import { readFileSync } from "node:fs";
          import { generateNarrative, defaultProviders } from "./scripts/daily/lib/ai.mjs";

          const data = JSON.parse(readFileSync("docs/data/2026-10-22.json", "utf8"));
          const providers = defaultProviders();
          console.log(`chain: ${providers.map((p) => `${p.name}(${p.model}${p.reasoningEffort ? ",effort=" + p.reasoningEffort : ""})`).join(" -> ")}`);
          const t0 = Date.now();
          const ai = await generateNarrative({ data, providers });
          const secs = ((Date.now() - t0) / 1000).toFixed(1);
          if (!ai) {
            console.log(`\nRESULT: null（全败）in ${secs}s`);
          } else {
            console.log(`\nRESULT: ok in ${secs}s provider=${ai.provider} model=${ai.model || "-"}`);
            console.log(`en.headline(${ai.en.headline.length}) ${ai.en.headline}`);
            console.log(`en.summary(${ai.en.summary.length}) ${ai.en.summary.slice(0, 120)}...`);
            console.log(`zh.headline(${ai.zh.headline.length}) ${ai.zh.headline}`);
          }
          EOF
