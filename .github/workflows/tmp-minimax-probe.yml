name: tmp-minimax-probe

# 一次性探针（用完即删，不进 main）。第一轮结论：小 prompt + max_tokens 1024
# 秒回 200；加 thinking:{type:"disabled"} 反而 400。所以 180s 挂死不是「thinking 吃预算」。
# 第二轮隔离真正的变量：max_tokens 49152（= MAX_TOKENS）与真实量级的 prompt。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe minimax variants
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          node --input-type=module - <<'EOF'
          import { randomUUID } from "node:crypto";
          const URL_ = "https://opencode.ai/inference/go/openai/v1/chat/completions";
          const KEY = process.env.OPENCODE_API_KEY;
          if (!KEY) { console.log("NO KEY"); process.exit(0); }
          const headers = {
            authorization: `Bearer ${KEY}`,
            "user-agent": "sogeisetsu-daily-report/1.0 (+https://github.com/sogeisetsu/sogeisetsu)",
            "x-opencode-session": `probe-${randomUUID()}`,
            "content-type": "application/json",
          };
          const system = 'Reply with ONE strict JSON object only: {"en":{"headline":"...","summary":"..."},"zh":{...}}';
          const smallUser = "Give me the JSON now.";
          // 真实日报 prompt 量级：凑一段 ~12k 字符的类 JSON 输入
          const bigUser = [
            "Input data (JSON):",
            JSON.stringify({ commits: Array.from({ length: 60 }, (_, i) => ({ repo: `user/repo-${i}`, count: 3, messages: ["fix: something", "docs: something else"] })), issues: Array.from({ length: 30 }, (_, i) => ({ repo: `user/repo-${i}`, number: 100 + i, title: "an issue title that is reasonably long to pad the payload" })) }),
            "Write the JSON now.",
          ].join("\n");
          async function probe(label, userText, bodyExtra, timeoutMs = 150000) {
            const ac = new AbortController();
            const t = setTimeout(() => ac.abort(), timeoutMs);
            const t0 = Date.now();
            const body = {
              model: "minimax-m3.1-flash-free",
              messages: [{ role: "system", content: system }, { role: "user", content: userText }],
              temperature: 0.3,
              ...bodyExtra,
            };
            try {
              const res = await fetch(URL_, { method: "POST", headers, body: JSON.stringify(body), signal: ac.signal });
              const text = await res.text();
              const secs = ((Date.now() - t0) / 1000).toFixed(1);
              console.log(`\n=== ${label} :: prompt=${userText.length}B HTTP ${res.status} in ${secs}s`);
              console.log(text.slice(0, 800));
            } catch (e) {
              const secs = ((Date.now() - t0) / 1000).toFixed(1);
              console.log(`\n=== ${label} :: prompt=${userText.length}B EXC ${e?.name} ${e?.message} in ${secs}s`);
            } finally {
              clearTimeout(t);
            }
          }
          const rf = { type: "json_object" };
          await probe("E small prompt + max_tokens 49152 + rf", smallUser, { max_tokens: 49152, response_format: rf });
          await probe("F big prompt + max_tokens 49152 + rf", bigUser, { max_tokens: 49152, response_format: rf });
          await probe("G big prompt + max_tokens 1024 + rf", bigUser, { max_tokens: 1024, response_format: rf });
          EOF
